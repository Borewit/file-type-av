name: Dependabot Pull Request
on: pull_request_target

concurrency:
  group: dependabot-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # Execute trusted base-branch scripts; PR manifests and lockfiles are only parsed as data.
      - uses: actions/checkout@v7
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'npm_and_yarn' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/dependabot
      - name: Label dependency scope
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'npm_and_yarn' }}
        uses: actions/github-script@v9
        env:
          DEPENDENCY_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
        with:
          script: |
            const label = require('./.github/scripts/dependabot/label.cjs');
            await label({github, context, core,
              dependencyNames: process.env.DEPENDENCY_NAMES.split(',').map(name => name.trim()).filter(Boolean)});
